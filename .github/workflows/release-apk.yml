name: Build Release APK

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # 是否按提交说明触发 release
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Check commit message / event
        id: check
        run: |
          set -e
          EVENT="${{ github.event_name }}"
          MSG="${{ github.event.head_commit.message }}"
          REF="${{ github.ref }}"
          echo "event=$EVENT"
          echo "ref=$REF"
          echo "message<<EOF"
          echo "$MSG"
          echo "EOF"

          SHOULD=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SHOULD=true
          elif [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            SHOULD=true
          elif [ "$EVENT" = "push" ]; then
            # 关键字：发布 / release / re构建 / [re] / 正式版 等（不匹配普通英文单词里的 re）
            # 用 bash 大小写不敏感匹配
            shopt -s nocasematch
            if [[ "$MSG" =~ 发布 ]] || \
               [[ "$MSG" =~ 正式 ]] || \
               [[ "$MSG" =~ release ]] || \
               [[ "$MSG" =~ re构建 ]] || \
               [[ "$MSG" =~ \[re\] ]] || \
               [[ "$MSG" =~ ^re[[:space:]] ]] || \
               [[ "$MSG" =~ [[:space:]]re[[:space:]] ]] || \
               [[ "$MSG" =~ /re ]] || \
               [[ "$MSG" =~ ^re/ ]]; then
              SHOULD=true
            fi
          fi
          echo "should_release=$SHOULD"
          echo "should_release=$SHOULD" >> "$GITHUB_OUTPUT"

  release:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release secrets
        env:
          HAS_KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          HAS_SP: ${{ secrets.RELEASE_STORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS != '' }}
          HAS_KP: ${{ secrets.RELEASE_KEY_PASSWORD != '' }}
        run: |
          echo "keystore_b64 set: $HAS_KS"
          echo "store_password set: $HAS_SP"
          echo "key_alias set: $HAS_ALIAS"
          echo "key_password set: $HAS_KP"
          if [ "$HAS_KS" != "true" ] || [ "$HAS_SP" != "true" ] || [ "$HAS_ALIAS" != "true" ] || [ "$HAS_KP" != "true" ]; then
            echo "::error::缺少 Release Secrets：RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD"
            exit 1
          fi

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/release.keystore"
          test -s "${GITHUB_WORKSPACE}/release.keystore"

      - name: Write keystore.properties
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<PROP
          storeFile=${GITHUB_WORKSPACE}/release.keystore
          storePassword=${RELEASE_STORE_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          keyPassword=${RELEASE_KEY_PASSWORD}
          PROP
          sed -i 's/^[[:space:]]*//' keystore.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: jhsy-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/release.keystore" keystore.properties
