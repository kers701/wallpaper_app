name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release secrets
        env:
          HAS_KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          HAS_SP: ${{ secrets.RELEASE_STORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS != '' }}
          HAS_KP: ${{ secrets.RELEASE_KEY_PASSWORD != '' }}
        run: |
          echo "keystore_b64 set: $HAS_KS"
          echo "store_password set: $HAS_SP"
          echo "key_alias set: $HAS_ALIAS"
          echo "key_password set: $HAS_KP"
          if [ "$HAS_KS" != "true" ] || [ "$HAS_SP" != "true" ] || [ "$HAS_ALIAS" != "true" ] || [ "$HAS_KP" != "true" ]; then
            echo "::error::缺少 Release Secrets。请在仓库 Settings → Secrets 中配置："
            echo "  RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD"
            exit 1
          fi

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/release.keystore"
          ls -la "${GITHUB_WORKSPACE}/release.keystore"
          # 基本校验：非空且像 DER
          test -s "${GITHUB_WORKSPACE}/release.keystore"

      - name: Write keystore.properties
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<PROP
          storeFile=${GITHUB_WORKSPACE}/release.keystore
          storePassword=${RELEASE_STORE_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          keyPassword=${RELEASE_KEY_PASSWORD}
          PROP
          # 去掉可能的前导空格
          sed -i 's/^[[:space:]]*//' keystore.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: jhsy-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: List outputs
        if: always()
        run: find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) 2>/dev/null || true

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f "${GITHUB_WORKSPACE}/release.keystore" keystore.properties
